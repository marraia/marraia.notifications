name: .NET

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write  # OIDC para o Trusted Publishing do nuget.org (sem API key fixa)

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Pack
      run: dotnet pack Marraia.Notifications/Marraia.Notifications.csproj --configuration Release --no-build -o ./artifacts

    - name: Upload package
      uses: actions/upload-artifact@v4
      with:
        name: nuget
        path: ./artifacts/*.nupkg

    # Publica no nuget.org somente ao criar uma tag v* (nunca em pull requests nem em push na master).
    # Trusted Publishing: troca o token OIDC do GitHub por uma API key temporária (1h),
    # validada pela política cadastrada em nuget.org > Trusted Publishing.
    - name: NuGet login (OIDC)
      if: startsWith(github.ref, 'refs/tags/v')
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: marraia  # nome do perfil no nuget.org (não é segredo)

    - name: Push to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push ./artifacts/*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
